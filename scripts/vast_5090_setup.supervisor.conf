[program:safety-setup]
command=/bin/bash /workspace/safety-dataset/scripts/vast_5090_setup.sh
directory=/workspace/safety-dataset
autostart=false
autorestart=false
startsecs=0
stdout_logfile=/workspace/safety-dataset/logs/setup.log
stderr_logfile=/workspace/safety-dataset/logs/setup.err.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
environment=HOME="/root",HF_HOME="/workspace/safety-dataset/hf-cache",HUGGINGFACE_HUB_CACHE="/workspace/safety-dataset/hf-cache/hub"
