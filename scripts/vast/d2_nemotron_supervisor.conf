[program:d2_nemotron]
command=/opt/supervisor-scripts/d2_nemotron.sh
directory=/workspace/safety-dataset
autostart=false
autorestart=false
startsecs=1
stopasgroup=true
killasgroup=true
stopwaitsecs=120
stdout_logfile=/workspace/safety-dataset/reports/d2_nemotron/supervisor.log
stderr_logfile=/workspace/safety-dataset/reports/d2_nemotron/supervisor.err.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",TOKENIZERS_PARALLELISM="false",HF_HUB_OFFLINE="1",TRANSFORMERS_OFFLINE="1"
