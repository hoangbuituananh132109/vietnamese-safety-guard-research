[program:decoder_baseline]
command=/venv/main/bin/python /workspace/safety-dataset/scripts/vast/run_decoder_baseline_after_phase0.py --hourly-rate 0.159 --initial-budget-usd 2.28 --reserve-usd 0.50
directory=/workspace/safety-dataset
autostart=true
autorestart=unexpected
startsecs=3
startretries=2
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/safety-dataset/reports/decoder_baseline/runner.log
stderr_logfile=/workspace/safety-dataset/reports/decoder_baseline/runner.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
redirect_stderr=true
