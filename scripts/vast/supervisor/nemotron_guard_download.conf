[program:nemotron_guard_download]
command=/venv/main/bin/python scripts/vast/download_nemotron_guard_v3.py
directory=/workspace/safety-dataset
autostart=true
autorestart=unexpected
startsecs=1
startretries=3
exitcodes=0
stdout_logfile=/workspace/safety-dataset/reports/decoder_baseline/download.log
stdout_logfile_maxbytes=0
redirect_stderr=true

