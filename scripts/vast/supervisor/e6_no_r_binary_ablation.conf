[program:e6-no-r-binary-ablation]
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/e6-no-r-binary-ablation.sh
directory=/workspace/safety-dataset
autostart=false
autorestart=unexpected
startsecs=5
startretries=1
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=60
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0
