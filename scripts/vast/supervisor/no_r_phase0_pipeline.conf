[program:no-r-phase0-pipeline]
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/no-r-phase0-pipeline.sh
directory=/workspace/safety-dataset
autostart=false
autorestart=unexpected
startsecs=5
startretries=1
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=60
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0
