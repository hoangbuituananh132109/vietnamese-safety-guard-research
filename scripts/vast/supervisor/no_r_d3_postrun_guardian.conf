[program:no-r-d3-postrun-guardian]
command=/venv/main/bin/python /workspace/safety-dataset/scripts/vast/no_r_d3_postrun_guardian.py
directory=/workspace/safety-dataset
autostart=true
autorestart=unexpected
startsecs=5
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/safety-dataset/logs/no-r-d3-postrun-guardian.log
stderr_logfile=/workspace/safety-dataset/logs/no-r-d3-postrun-guardian.err.log
stdout_logfile_maxbytes=25MB
stderr_logfile_maxbytes=25MB
