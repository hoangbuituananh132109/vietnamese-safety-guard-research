[program:vllm_runtime_install]
command=/venv/main/bin/python /workspace/safety-dataset/scripts/vast/install_vllm_runtime.py
directory=/workspace/safety-dataset
autostart=true
autorestart=unexpected
startsecs=2
startretries=2
exitcodes=0
stdout_logfile=/workspace/safety-dataset/reports/decoder_baseline/vllm_install.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=2
redirect_stderr=true
