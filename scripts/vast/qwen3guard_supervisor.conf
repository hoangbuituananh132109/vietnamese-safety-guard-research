[program:qwen3guard]
environment=PROC_NAME="%(program_name)s"
command=/workspace/safety-dataset/scripts/vast/run_qwen3guard_stage.sh
autostart=false
autorestart=false
startsecs=1
stopasgroup=true
killasgroup=true
stopsignal=TERM
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0
