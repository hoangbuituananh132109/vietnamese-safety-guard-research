[program:decoder-eval-setup]
command=/bin/bash /workspace/safety-dataset/scripts/vast_decoder_eval_setup.sh
directory=/workspace/safety-dataset
autostart=false
autorestart=unexpected
startsecs=5
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/safety-dataset/logs/eval-setup.log
stderr_logfile=/workspace/safety-dataset/logs/eval-setup.err.log
stdout_logfile_maxbytes=25MB
stderr_logfile_maxbytes=25MB

[program:no-r-decoder-pipeline]
command=/venv/main/bin/python /workspace/safety-dataset/scripts/run_no_r_decoder_pipeline.py
directory=/workspace/safety-dataset
autostart=false
autorestart=false
startsecs=5
startretries=0
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/safety-dataset/logs/no-r-decoder-pipeline.log
stderr_logfile=/workspace/safety-dataset/logs/no-r-decoder-pipeline.err.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
