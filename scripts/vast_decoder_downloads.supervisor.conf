[program:decoder-download-qwen]
command=/bin/bash -lc 'set -Eeuo pipefail; export HF_HOME=/workspace/safety-dataset/hf-cache HUGGINGFACE_HUB_CACHE=/workspace/safety-dataset/hf-cache/hub TOKENIZERS_PARALLELISM=false; until test -f /workspace/safety-dataset/.setup_complete; do sleep 5; done; exec /venv/main/bin/python /workspace/safety-dataset/scripts/vast_download_profile_model.py qwen --max-workers 8'
directory=/workspace/safety-dataset
autostart=false
autorestart=unexpected
startsecs=5
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/safety-dataset/logs/download-qwen.log
stderr_logfile=/workspace/safety-dataset/logs/download-qwen.err.log
stdout_logfile_maxbytes=25MB
stderr_logfile_maxbytes=25MB

