[program:qwen-eval-priority-switch]
command=/bin/bash /workspace/safety-dataset/scripts/vast_pause_nemotron_for_qwen_eval.sh
directory=/workspace/safety-dataset
autostart=false
autorestart=false
startsecs=3
startretries=0
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/safety-dataset/logs/no_r_decoder_4080s/qwen-eval-priority-switch.stdout.log
stderr_logfile=/workspace/safety-dataset/logs/no_r_decoder_4080s/qwen-eval-priority-switch.stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
